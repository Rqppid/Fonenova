name: FoneNova cloud pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-agent-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [website, dashboard]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up pnpm for website
        if: matrix.app == 'website'
        uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false
      - name: Install website dependencies
        if: matrix.app == 'website'
        run: pnpm install --frozen-lockfile
      - name: Test website
        if: matrix.app == 'website'
        run: pnpm test
      - name: Install dashboard dependencies
        if: matrix.app == 'dashboard'
        working-directory: dashboard
        run: npm ci
      - name: Test dashboard
        if: matrix.app == 'dashboard'
        working-directory: dashboard
        run: npm test
      - name: Write result
        if: always()
        env:
          APP: ${{ matrix.app }}
          RESULT: ${{ job.status }}
        run: |
          printf '## %s\n\nResult: %s\n\nUnit tests only. No production credentials, model calls, or deployment.\n' "$APP" "$RESULT" >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: Pilot summary
    if: always()
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Summarize
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          printf '## FoneNova cloud pilot\n\nCombined test result: %s\n\nOpen each app job for details. AI workers are not enabled in this pilot.\n' "$RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$RESULT" = success
